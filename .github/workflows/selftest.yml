name: selftest

on:
  push:
  pull_request:

jobs:
  standard-library:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        julia: ["1.11", "1.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia }}
      - name: Static checks of the skills
        run: julia tests/static_check.jl
      - name: Self-tests that need no packages
        run: julia tests/run_checks.jl level=ci
